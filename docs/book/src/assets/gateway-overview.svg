<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" role="img" aria-labelledby="title desc">
  <title id="title">ContextForge Gateway request and response path</title>
  <desc id="desc">An MCP client sends streamable HTTP traffic to the ContextForge Gateway. The gateway validates the caller, loads runtime configuration, calls backend MCP servers, receives backend responses, merges them, and returns one MCP response or stream to the client.</desc>

  <rect x="0" y="0" width="980" height="330" rx="18" fill="#ffffff" />
  <rect x="1" y="1" width="978" height="328" rx="18" fill="none" stroke="#d7dde5" />

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2933; }
    .title { font-size: 18px; font-weight: 700; }
    .body { font-size: 13px; fill: #4b5563; }
    .mini { font-size: 12px; fill: #5f6b7a; }
    .arrow { stroke: #526171; stroke-width: 2.5; fill: none; }
    .request-arrow { stroke: #3d75a8; }
    .response-arrow { stroke: #2f8f6b; }
    .request-fill { fill: #3d75a8; }
    .response-fill { fill: #2f8f6b; }
    .request-label { fill: #315f87; }
    .response-label { fill: #2f6b50; }
  </style>

  <g>
    <rect x="36" y="86" width="178" height="112" rx="12" fill="#eef7ff" stroke="#4b8bbe" stroke-width="2" />
    <text x="125" y="124" text-anchor="middle" class="title">MCP client</text>
    <text x="125" y="153" text-anchor="middle" class="body">streamable HTTP</text>
    <text x="125" y="176" text-anchor="middle" class="body">JWT + session id</text>
  </g>

  <g>
    <line x1="226" y1="128" x2="300" y2="128" class="arrow request-arrow" />
    <polygon points="300,128 289,122 289,134" class="request-fill" />
    <text x="263" y="110" text-anchor="middle" class="mini request-label">MCP request</text>

    <line x1="300" y1="178" x2="226" y2="178" class="arrow response-arrow" />
    <polygon points="226,178 237,172 237,184" class="response-fill" />
    <text x="263" y="205" text-anchor="middle" class="mini response-label">merged response</text>
  </g>

  <g>
    <rect x="314" y="48" width="308" height="188" rx="12" fill="#f1fbf5" stroke="#3f9b6d" stroke-width="2" />
    <text x="468" y="84" text-anchor="middle" class="title">ContextForge Gateway</text>

    <rect x="350" y="108" width="236" height="30" rx="8" fill="#ffffff" stroke="#cdd8d1" />
    <text x="468" y="128" text-anchor="middle" class="body">validate caller</text>

    <rect x="350" y="148" width="236" height="30" rx="8" fill="#ffffff" stroke="#cdd8d1" />
    <text x="468" y="168" text-anchor="middle" class="body">load runtime config</text>

    <rect x="350" y="188" width="236" height="30" rx="8" fill="#ffffff" stroke="#cdd8d1" />
    <text x="468" y="208" text-anchor="middle" class="body">route and merge MCP methods</text>
  </g>

  <g>
    <rect x="350" y="260" width="236" height="46" rx="12" fill="#fff8e7" stroke="#c28a25" stroke-width="2" />
    <text x="468" y="289" text-anchor="middle" class="body">Redis runtime config by JWT subject</text>
    <line x1="468" y1="256" x2="468" y2="238" class="arrow" stroke-dasharray="5 5" />
    <polygon points="468,238 462,249 474,249" fill="#526171" />
  </g>

  <g>
    <line x1="634" y1="128" x2="706" y2="128" class="arrow request-arrow" />
    <polygon points="706,128 695,122 695,134" class="request-fill" />
    <text x="670" y="110" text-anchor="middle" class="mini request-label">backend calls</text>

    <line x1="706" y1="178" x2="634" y2="178" class="arrow response-arrow" />
    <polygon points="634,178 645,172 645,184" class="response-fill" />
    <text x="670" y="205" text-anchor="middle" class="mini response-label">backend responses</text>
  </g>

  <g>
    <rect x="720" y="58" width="224" height="168" rx="12" fill="#f7f4ff" stroke="#7b68b4" stroke-width="2" />
    <text x="832" y="94" text-anchor="middle" class="title">Backend MCP servers</text>

    <rect x="750" y="118" width="164" height="28" rx="8" fill="#ffffff" stroke="#d9d2ef" />
    <text x="832" y="137" text-anchor="middle" class="body">gateway-one</text>

    <rect x="750" y="154" width="164" height="28" rx="8" fill="#ffffff" stroke="#d9d2ef" />
    <text x="832" y="173" text-anchor="middle" class="body">gateway-two</text>

    <rect x="750" y="190" width="164" height="28" rx="8" fill="#ffffff" stroke="#d9d2ef" />
    <text x="832" y="209" text-anchor="middle" class="body">more backends</text>
  </g>

  <g>
    <rect x="314" y="18" width="308" height="22" rx="11" fill="#e8f5ee" />
    <text x="468" y="34" text-anchor="middle" class="mini">one logical MCP server downstream</text>
  </g>
</svg>
