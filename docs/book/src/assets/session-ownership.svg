<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Session ownership</title>
  <desc id="desc">Initialize creates local backend MCP running services keyed by principal, backend name, and downstream session id. Later calls use Mcp-session-id to find them, and DELETE removes local state.</desc>

  <rect x="0" y="0" width="1120" height="520" rx="18" fill="#ffffff" />
  <rect x="1" y="1" width="1118" height="518" rx="18" fill="none" stroke="#d7dde5" />

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2933; }
    .title { font-size: 18px; font-weight: 700; }
    .section { font-size: 16px; font-weight: 700; }
    .body { font-size: 13px; fill: #4b5563; }
    .mini { font-size: 12px; fill: #5f6b7a; }
    .label { font-size: 12px; font-weight: 700; }
    .client { fill: #eef7ff; stroke: #4b8bbe; stroke-width: 2; }
    .session { fill: #f1fbf5; stroke: #3f9b6d; stroke-width: 2; }
    .store { fill: #f7f4ff; stroke: #7b68b4; stroke-width: 2; }
    .backend { fill: #fff8e7; stroke: #c28a25; stroke-width: 2; }
    .cleanup { fill: #fff1f0; stroke: #d65f5f; stroke-width: 1.8; }
    .box { fill: #ffffff; stroke: #cfd8e3; stroke-width: 1.5; }
    .blue { stroke: #3d75a8; stroke-width: 2.6; fill: none; }
    .green { stroke: #2f8f6b; stroke-width: 2.6; fill: none; }
    .amber { stroke: #c28a25; stroke-width: 2.6; fill: none; }
    .purple { stroke: #7b68b4; stroke-width: 2.6; fill: none; }
    .red { stroke: #d65f5f; stroke-width: 2.4; fill: none; }
    .dash { stroke-dasharray: 5 5; }
    .blue-fill { fill: #3d75a8; }
    .green-fill { fill: #2f8f6b; }
    .amber-fill { fill: #c28a25; }
    .purple-fill { fill: #7b68b4; }
    .red-fill { fill: #d65f5f; }
    .blue-text { fill: #315f87; }
    .green-text { fill: #2f6b50; }
    .amber-text { fill: #8a621b; }
    .purple-text { fill: #5d4fa0; }
    .red-text { fill: #9f3a3a; }
  </style>

  <g>
    <rect x="44" y="154" width="178" height="104" rx="14" class="client" />
    <text x="133" y="190" text-anchor="middle" class="title">MCP client</text>
    <text x="133" y="220" text-anchor="middle" class="body">initialize</text>
    <text x="133" y="242" text-anchor="middle" class="mini">then Mcp-session-id</text>
  </g>

  <g>
    <rect x="304" y="54" width="276" height="390" rx="16" class="session" />
    <text x="442" y="92" text-anchor="middle" class="section">Gateway process</text>

    <rect x="336" y="126" width="212" height="58" rx="9" class="box" />
    <text x="442" y="151" text-anchor="middle" class="body">RMCP LocalSessionManager</text>
    <text x="442" y="172" text-anchor="middle" class="mini">creates downstream session id</text>

    <rect x="336" y="216" width="212" height="58" rx="9" class="box" />
    <text x="442" y="241" text-anchor="middle" class="body">SessionManager</text>
    <text x="442" y="262" text-anchor="middle" class="mini">principal + session + virtual host</text>

    <rect x="336" y="306" width="212" height="72" rx="9" class="box" />
    <text x="442" y="331" text-anchor="middle" class="body">BackendTransports</text>
    <text x="442" y="352" text-anchor="middle" class="mini">principal + backend + session</text>
    <text x="442" y="369" text-anchor="middle" class="mini">Arc&lt;RunningService&gt;</text>
  </g>

  <g>
    <rect x="704" y="70" width="284" height="98" rx="14" class="store" />
    <text x="846" y="104" text-anchor="middle" class="title">LocalUserSessionStore</text>
    <text x="846" y="134" text-anchor="middle" class="body">local LRU mapping</text>
    <text x="846" y="154" text-anchor="middle" class="mini">Redis store exists, not wired by default</text>

    <rect x="704" y="256" width="284" height="112" rx="14" class="backend" />
    <text x="846" y="292" text-anchor="middle" class="title">Backend MCP services</text>
    <text x="846" y="322" text-anchor="middle" class="body">one running service per backend</text>
    <text x="846" y="345" text-anchor="middle" class="mini">local process ownership</text>
  </g>

  <g>
    <rect x="704" y="414" width="284" height="52" rx="12" class="cleanup" />
    <text x="846" y="446" text-anchor="middle" class="body">DELETE cleanup removes local entries</text>
  </g>

  <g>
    <line x1="222" y1="206" x2="326" y2="155" class="blue" />
    <polygon points="326,155 314,154 321,144" class="blue-fill" />
    <text x="270" y="166" text-anchor="middle" class="label blue-text">initialize</text>

    <line x1="548" y1="155" x2="694" y2="119" class="purple dash" />
    <polygon points="694,119 681,116 684,128" class="purple-fill" />
    <text x="626" y="122" text-anchor="middle" class="label purple-text">session mapping</text>

    <line x1="548" y1="342" x2="694" y2="312" class="amber" />
    <polygon points="694,312 681,308 684,320" class="amber-fill" />
    <text x="626" y="312" text-anchor="middle" class="label amber-text">create services</text>

    <line x1="704" y1="334" x2="558" y2="352" class="green" />
    <polygon points="558,352 570,357 569,345" class="green-fill" />
    <text x="626" y="363" text-anchor="middle" class="label green-text">store handles</text>

    <path d="M 222 230 L 292 230 L 292 245 L 326 245" class="green" />
    <polygon points="326,245 315,239 315,251" class="green-fill" />
    <text x="270" y="252" text-anchor="middle" class="label green-text">later calls</text>

    <path d="M 442 378 L 442 440 L 694 440" class="red dash" />
    <polygon points="694,440 683,434 683,446" class="red-fill" />
    <text x="558" y="424" text-anchor="middle" class="label red-text">successful DELETE</text>
  </g>
</svg>
