<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Architectural choices</title>
  <desc id="desc">The gateway keeps control plane concerns out, abstracts config access, treats backend names as public namespace, keeps sessions local today, exposes merged MCP semantics, and keeps plugin boundaries explicit.</desc>

  <rect x="0" y="0" width="1120" height="560" rx="18" fill="#ffffff" />
  <rect x="1" y="1" width="1118" height="558" rx="18" fill="none" stroke="#d7dde5" />

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2933; }
    .title { font-size: 17px; font-weight: 700; }
    .body { font-size: 13px; fill: #4b5563; }
    .mini { font-size: 12px; fill: #5f6b7a; }
    .label { font-size: 12px; font-weight: 700; }
    .core { fill: #f1fbf5; stroke: #3f9b6d; stroke-width: 2.2; }
    .blue { fill: #eef7ff; stroke: #4b8bbe; stroke-width: 2; }
    .amber { fill: #fff8e7; stroke: #c28a25; stroke-width: 2; }
    .purple { fill: #f7f4ff; stroke: #7b68b4; stroke-width: 2; }
    .red { fill: #fff1f0; stroke: #d65f5f; stroke-width: 1.8; }
    .line { stroke: #9aa8b7; stroke-width: 1.8; fill: none; }
    .dash { stroke-dasharray: 5 5; }
    .line-fill { fill: #9aa8b7; }
  </style>

  <g>
    <rect x="398" y="218" width="324" height="124" rx="18" class="core" />
    <text x="560" y="262" text-anchor="middle" class="title">Rust gateway dataplane</text>
    <text x="560" y="292" text-anchor="middle" class="body">hot-path MCP enforcement</text>
    <text x="560" y="315" text-anchor="middle" class="mini">auth, config lookup, routing, hooks, telemetry</text>
  </g>

  <g>
    <rect x="58" y="64" width="266" height="92" rx="14" class="blue" />
    <text x="191" y="98" text-anchor="middle" class="title">Not control plane</text>
    <text x="191" y="128" text-anchor="middle" class="body">consume config, do not author it</text>

    <rect x="58" y="234" width="266" height="92" rx="14" class="purple" />
    <text x="191" y="268" text-anchor="middle" class="title">Config behind traits</text>
    <text x="191" y="298" text-anchor="middle" class="body">Redis is adapter, not model</text>

    <rect x="58" y="404" width="266" height="92" rx="14" class="amber" />
    <text x="191" y="438" text-anchor="middle" class="title">Backend names public</text>
    <text x="191" y="468" text-anchor="middle" class="body">map key becomes MCP namespace</text>
  </g>

  <g>
    <rect x="796" y="64" width="266" height="92" rx="14" class="amber" />
    <text x="929" y="98" text-anchor="middle" class="title">Merged MCP contract</text>
    <text x="929" y="128" text-anchor="middle" class="body">one gateway server view</text>

    <rect x="796" y="234" width="266" height="92" rx="14" class="red" />
    <text x="929" y="268" text-anchor="middle" class="title">Sessions local today</text>
    <text x="929" y="298" text-anchor="middle" class="body">sticky routing or redesign needed</text>

    <rect x="796" y="404" width="266" height="92" rx="14" class="purple" />
    <text x="929" y="438" text-anchor="middle" class="title">Explicit plugin hooks</text>
    <text x="929" y="468" text-anchor="middle" class="body">known ordering and failure behavior</text>
  </g>

  <g>
    <path d="M 324 110 C 384 110 390 238 398 250" class="line" />
    <polygon points="398,250 389,241 386,253" class="line-fill" />

    <path d="M 324 280 L 388 280" class="line" />
    <polygon points="398,280 387,274 387,286" class="line-fill" />

    <path d="M 324 450 C 384 450 390 322 398 310" class="line" />
    <polygon points="398,310 386,307 389,319" class="line-fill" />

    <path d="M 722 250 C 780 238 788 110 796 110" class="line" />
    <polygon points="796,110 785,104 785,116" class="line-fill" />

    <path d="M 722 280 L 786 280" class="line" />
    <polygon points="796,280 785,274 785,286" class="line-fill" />

    <path d="M 722 310 C 780 322 788 450 796 450" class="line" />
    <polygon points="796,450 785,444 785,456" class="line-fill" />
  </g>

  <g>
    <rect x="390" y="448" width="340" height="50" rx="10" fill="#fbfcfe" stroke="#d7dde5" />
    <text x="560" y="478" text-anchor="middle" class="mini">Changing a choice requires code, tests, docs, and migration notes.</text>
  </g>
</svg>
