<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Runtime configuration surfaces</title>
  <desc id="desc">Process configuration is loaded at startup. UserConfig is loaded per request by JWT subject and virtual host id. RuntimePluginConfigDocument is loaded from Redis when CPEX plugins are enabled and can be reloaded by the watcher.</desc>

  <rect x="0" y="0" width="1120" height="560" rx="18" fill="#ffffff" />
  <rect x="1" y="1" width="1118" height="558" rx="18" fill="none" stroke="#d7dde5" />

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2933; }
    .title { font-size: 18px; font-weight: 700; }
    .section { font-size: 16px; font-weight: 700; }
    .body { font-size: 13px; fill: #4b5563; }
    .mini { font-size: 12px; fill: #5f6b7a; }
    .label { font-size: 12px; font-weight: 700; }
    .process { fill: #eef7ff; stroke: #4b8bbe; stroke-width: 2; }
    .user { fill: #fff8e7; stroke: #c28a25; stroke-width: 2; }
    .plugin { fill: #f7f4ff; stroke: #7b68b4; stroke-width: 2; }
    .gateway { fill: #f1fbf5; stroke: #3f9b6d; stroke-width: 2; }
    .box { fill: #ffffff; stroke: #cfd8e3; stroke-width: 1.5; }
    .blue { stroke: #3d75a8; stroke-width: 2.5; fill: none; }
    .green { stroke: #2f8f6b; stroke-width: 2.5; fill: none; }
    .amber { stroke: #c28a25; stroke-width: 2.5; fill: none; }
    .purple { stroke: #7b68b4; stroke-width: 2.5; fill: none; }
    .dash { stroke-dasharray: 5 5; }
    .blue-fill { fill: #3d75a8; }
    .green-fill { fill: #2f8f6b; }
    .amber-fill { fill: #c28a25; }
    .purple-fill { fill: #7b68b4; }
    .blue-text { fill: #315f87; }
    .green-text { fill: #2f6b50; }
    .amber-text { fill: #8a621b; }
    .purple-text { fill: #5d4fa0; }
  </style>

  <g>
    <rect x="38" y="44" width="254" height="126" rx="14" class="process" />
    <text x="165" y="80" text-anchor="middle" class="title">Process Config</text>
    <text x="165" y="110" text-anchor="middle" class="body">CLI + env at startup</text>
    <text x="165" y="134" text-anchor="middle" class="mini">listeners, JWT keys, Redis, TLS</text>
    <text x="165" y="153" text-anchor="middle" class="mini">telemetry, runtime shape, plugins</text>
  </g>

  <g>
    <rect x="38" y="220" width="254" height="126" rx="14" class="user" />
    <text x="165" y="256" text-anchor="middle" class="title">UserConfig</text>
    <text x="165" y="286" text-anchor="middle" class="body">Redis MessagePack</text>
    <text x="165" y="310" text-anchor="middle" class="mini">key: User::new(claims.sub)</text>
    <text x="165" y="329" text-anchor="middle" class="mini">value: UserConfig</text>
  </g>

  <g>
    <rect x="38" y="390" width="254" height="126" rx="14" class="plugin" />
    <text x="165" y="426" text-anchor="middle" class="title">Plugin Config</text>
    <text x="165" y="456" text-anchor="middle" class="body">RuntimePluginConfigDocument</text>
    <text x="165" y="480" text-anchor="middle" class="mini">JSON or MessagePack</text>
    <text x="165" y="499" text-anchor="middle" class="mini">CPEX pre/post tool hooks</text>
  </g>

  <g>
    <rect x="404" y="86" width="294" height="388" rx="16" class="gateway" />
    <text x="551" y="124" text-anchor="middle" class="section">Gateway dataplane</text>

    <rect x="438" y="152" width="226" height="46" rx="8" class="box" />
    <text x="551" y="181" text-anchor="middle" class="body">startup assembly</text>

    <rect x="438" y="236" width="226" height="64" rx="8" class="box" />
    <text x="551" y="260" text-anchor="middle" class="body">request middleware</text>
    <text x="551" y="282" text-anchor="middle" class="mini">claims.sub -> UserConfig</text>

    <rect x="438" y="326" width="226" height="64" rx="8" class="box" />
    <text x="551" y="350" text-anchor="middle" class="body">MCP validators</text>
    <text x="551" y="372" text-anchor="middle" class="mini">VirtualHostId -> VirtualHost</text>

    <rect x="438" y="414" width="226" height="42" rx="8" class="box" />
    <text x="551" y="440" text-anchor="middle" class="body">optional CPEX runtime</text>
  </g>

  <g>
    <rect x="788" y="126" width="282" height="106" rx="14" class="user" />
    <text x="929" y="160" text-anchor="middle" class="title">Selected VirtualHost</text>
    <text x="929" y="190" text-anchor="middle" class="body">backend map key is namespace</text>
    <text x="929" y="213" text-anchor="middle" class="mini">backend URL builds upstream transport</text>

    <rect x="788" y="302" width="282" height="106" rx="14" class="plugin" />
    <text x="929" y="336" text-anchor="middle" class="title">CPEX Runtime</text>
    <text x="929" y="366" text-anchor="middle" class="body">loaded at startup</text>
    <text x="929" y="389" text-anchor="middle" class="mini">watcher reloads every 10 minutes</text>
  </g>

  <g>
    <line x1="292" y1="107" x2="394" y2="175" class="blue" />
    <polygon points="394,175 382,173 389,163" class="blue-fill" />
    <text x="342" y="126" text-anchor="middle" class="label blue-text">startup</text>

    <line x1="292" y1="283" x2="428" y2="268" class="amber" />
    <polygon points="428,268 416,263 418,275" class="amber-fill" />
    <text x="360" y="264" text-anchor="middle" class="label amber-text">per request</text>

    <line x1="664" y1="358" x2="778" y2="180" class="green" />
    <polygon points="778,180 767,186 777,192" class="green-fill" />
    <text x="728" y="254" text-anchor="middle" class="label green-text">select route</text>

    <path d="M 292 453 L 404 453 L 404 436 L 428 436" class="purple" />
    <polygon points="428,436 417,430 417,442" class="purple-fill" />
    <text x="350" y="438" text-anchor="middle" class="label purple-text">plugin document</text>

    <line x1="664" y1="436" x2="778" y2="355" class="purple" />
    <polygon points="778,355 766,357 773,367" class="purple-fill" />
    <text x="728" y="390" text-anchor="middle" class="label purple-text">active hooks</text>

    <path d="M 929 408 C 929 510 438 510 438 456" class="purple dash" />
    <polygon points="438,456 432,467 444,467" class="purple-fill" />
    <text x="708" y="524" text-anchor="middle" class="label purple-text">reload swaps runtime state</text>
  </g>
</svg>
