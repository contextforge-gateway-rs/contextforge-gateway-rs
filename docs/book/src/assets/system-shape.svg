<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">ContextForge Data Plane system shape</title>
  <desc id="desc">The ContextForge control plane writes runtime config into Redis. MCP clients call the Rust gateway dataplane. The gateway loads config, validates identity, calls backend MCP servers, receives backend responses, merges them, and returns one downstream response.</desc>

  <rect x="0" y="0" width="1040" height="430" rx="18" fill="#ffffff" />
  <rect x="1" y="1" width="1038" height="428" rx="18" fill="none" stroke="#d7dde5" />

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2933; }
    .title { font-size: 18px; font-weight: 700; }
    .body { font-size: 13px; fill: #4b5563; }
    .mini { font-size: 12px; fill: #5f6b7a; }
    .label { font-size: 12px; font-weight: 700; }
    .arrow { stroke-width: 2.5; fill: none; }
    .request { stroke: #3d75a8; }
    .response { stroke: #2f8f6b; }
    .config { stroke: #c28a25; }
    .request-fill { fill: #3d75a8; }
    .response-fill { fill: #2f8f6b; }
    .config-fill { fill: #c28a25; }
    .request-text { fill: #315f87; }
    .response-text { fill: #2f6b50; }
    .config-text { fill: #8a621b; }
  </style>

  <g>
    <rect x="34" y="42" width="210" height="116" rx="12" fill="#eef7ff" stroke="#4b8bbe" stroke-width="2" />
    <text x="139" y="78" text-anchor="middle" class="title">Control plane</text>
    <text x="139" y="107" text-anchor="middle" class="body">management, UI, IAM</text>
    <text x="139" y="130" text-anchor="middle" class="body">config and policy authoring</text>
  </g>

  <g>
    <rect x="34" y="264" width="210" height="116" rx="12" fill="#eef7ff" stroke="#4b8bbe" stroke-width="2" />
    <text x="139" y="300" text-anchor="middle" class="title">MCP client</text>
    <text x="139" y="329" text-anchor="middle" class="body">streamable HTTP</text>
    <text x="139" y="352" text-anchor="middle" class="body">JWT + MCP session</text>
  </g>

  <g>
    <rect x="406" y="68" width="280" height="284" rx="14" fill="#f1fbf5" stroke="#3f9b6d" stroke-width="2" />
    <text x="546" y="104" text-anchor="middle" class="title">Rust gateway dataplane</text>
    <text x="546" y="131" text-anchor="middle" class="mini">one logical MCP server downstream</text>

    <rect x="438" y="154" width="216" height="28" rx="8" fill="#ffffff" stroke="#cdd8d1" />
    <text x="546" y="173" text-anchor="middle" class="body">Axum listener stack</text>

    <rect x="438" y="194" width="216" height="28" rx="8" fill="#ffffff" stroke="#cdd8d1" />
    <text x="546" y="213" text-anchor="middle" class="body">auth + request context</text>

    <rect x="438" y="234" width="216" height="28" rx="8" fill="#ffffff" stroke="#cdd8d1" />
    <text x="546" y="253" text-anchor="middle" class="body">UserConfig lookup</text>

    <rect x="438" y="274" width="216" height="28" rx="8" fill="#ffffff" stroke="#cdd8d1" />
    <text x="546" y="293" text-anchor="middle" class="body">MCP fanout + merge</text>

    <rect x="438" y="314" width="216" height="28" rx="8" fill="#ffffff" stroke="#cdd8d1" />
    <text x="546" y="333" text-anchor="middle" class="body">hooks + telemetry</text>
  </g>

  <g>
    <rect x="796" y="42" width="210" height="116" rx="12" fill="#fff8e7" stroke="#c28a25" stroke-width="2" />
    <text x="901" y="78" text-anchor="middle" class="title">Redis config</text>
    <text x="901" y="107" text-anchor="middle" class="body">UserConfig by JWT subject</text>
    <text x="901" y="130" text-anchor="middle" class="body">plugin runtime config</text>
  </g>

  <g>
    <rect x="796" y="264" width="210" height="116" rx="12" fill="#f7f4ff" stroke="#7b68b4" stroke-width="2" />
    <text x="901" y="294" text-anchor="middle" class="title">Backend MCP</text>
    <text x="901" y="318" text-anchor="middle" class="title">servers</text>
    <text x="901" y="345" text-anchor="middle" class="body">tools, resources, prompts</text>
    <text x="901" y="368" text-anchor="middle" class="body">per-backend sessions</text>
  </g>

  <g>
    <path d="M 139 42 L 139 26 L 901 26 L 901 40" class="arrow config" />
    <polygon points="901,42 895,31 907,31" class="config-fill" />
    <text x="520" y="20" text-anchor="middle" class="label config-text">writes runtime config</text>

    <line x1="796" y1="148" x2="662" y2="226" class="arrow config" stroke-dasharray="5 5" />
    <polygon points="662,226 674,225 668,215" class="config-fill" />
    <text x="735" y="190" text-anchor="middle" class="label config-text">loads config</text>
  </g>

  <g>
    <line x1="244" y1="304" x2="394" y2="246" class="arrow request" />
    <polygon points="394,246 382,245 386,256" class="request-fill" />
    <text x="319" y="260" text-anchor="middle" class="label request-text">MCP request</text>

    <line x1="398" y1="292" x2="244" y2="342" class="arrow response" />
    <polygon points="244,342 256,344 252,333" class="response-fill" />
    <text x="320" y="339" text-anchor="middle" class="label response-text">merged response</text>
  </g>

  <g>
    <line x1="686" y1="288" x2="786" y2="304" class="arrow request" />
    <polygon points="786,304 776,297 774,309" class="request-fill" />
    <text x="736" y="279" text-anchor="middle" class="label request-text">backend calls</text>

    <line x1="786" y1="342" x2="686" y2="324" class="arrow response" />
    <polygon points="686,324 696,331 698,319" class="response-fill" />
    <text x="736" y="376" text-anchor="middle" class="label response-text">backend responses</text>
  </g>
</svg>
