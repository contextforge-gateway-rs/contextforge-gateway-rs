# Prometheus scrape configuration for the local metrics-verification stack
# (issue #4721 follow-up).
#
# Only one job: pull the Prometheus-text representation of the metrics
# emitted by the gateway, as converted by the OTel Collector's
# `prometheus` exporter (see otel-collector-config.yaml).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
