# Lightweight dependencies for running the dataplane binary from Cargo.
name: contextforge-data-plane-local

networks:
  contextforge-data-plane-net:
    driver: bridge

services:
  gateway-one:
    image: mcp_counter
    build:
      dockerfile: mcp_counter.Dockerfile
    networks: [contextforge-data-plane-net]
    ports:
      - "5555:5555"
    environment:
      - RUST_LOG=warn
    sysctls:
      - net.ipv4.tcp_fin_timeout=15
      - net.ipv4.ip_local_port_range=1024 65535
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      redis:
        condition: service_healthy

  gateway-two:
    image: mcp_conformance
    build:
      dockerfile: mcp_conformance.Dockerfile
    networks: [contextforge-data-plane-net]
    ports:
      - "5556:5556"
    environment:
      - RUST_LOG=warn
      - PORT=5556
    sysctls:
      - net.ipv4.tcp_fin_timeout=15
      - net.ipv4.ip_local_port_range=1024 65535
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:latest
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Performance tuning for 1000+ RPS high-concurrency load testing
    command:
      - "redis-server"
      - "--maxmemory"
      - "1gb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--tcp-backlog"
      - "2048"
      - "--timeout"
      - "0"
      - "--tcp-keepalive"
      - "300"
      - "--maxclients"
      - "10000"
      - "--port"
      - "6379"
      - "--tls-port"
      - "16379"
      - "--tls-cert-file"
      - "/tls_config/contextforge-server.cert.pem"
      - "--tls-key-file"
      - "/tls_config/contextforge-server.key.pem"
      - "--tls-auth-clients"
      - "no"
      # - "--tls-ca-cert-file"
      # - "/tls_config/contextforge.intermediate.cert.pem"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "6379:6379"
      - "16379:16379"
    volumes:
      - ../assets/contextforgeCA/:/tls_config:z

    networks: [contextforge-data-plane-net]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
