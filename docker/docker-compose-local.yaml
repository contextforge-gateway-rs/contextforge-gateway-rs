# Lightweight dependencies for running the dataplane binary from Cargo.
name: contextforge-data-plane-local

networks:
  contextforge-data-plane-net:
    driver: bridge

services:
  fast_time_server:
    image: ghcr.io/ibm/cfex-mcp-fast-time-server:latest
    restart: unless-stopped
    networks: [contextforge-data-plane-net]
    ports:
      - "8880:8880"
    environment:
      - BIND_ADDRESS=0.0.0.0:8880
      - RUST_LOG=info
    sysctls:
      - net.ipv4.tcp_fin_timeout=15
      - net.ipv4.ip_local_port_range=1024 65535
      - net.core.somaxconn=65535
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 5000
        hard: 5000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8880/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:latest
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Performance tuning for 1000+ RPS high-concurrency load testing
    command:
      - "redis-server"
      - "--maxmemory"
      - "1gb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--tcp-backlog"
      - "2048"
      - "--timeout"
      - "0"
      - "--tcp-keepalive"
      - "300"
      - "--maxclients"
      - "10000"
      - "--port"
      - "6379"
      - "--tls-port"
      - "16379"
      - "--tls-cert-file"
      - "/tls_config/contextforge-server.cert.pem"
      - "--tls-key-file"
      - "/tls_config/contextforge-server.key.pem"
      - "--tls-auth-clients"
      - "no"
      # - "--tls-ca-cert-file"
      # - "/tls_config/contextforge.intermediate.cert.pem"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "6379:6379"
      - "16379:16379"
    volumes:
      - ../assets/contextforgeCA/:/tls_config:z

    networks: [contextforge-data-plane-net]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
