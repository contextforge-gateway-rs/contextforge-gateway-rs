name: Docker Image CI

on:
  push:
   branches: [ "main" ]
   # tags: ["2.0.0"]
    
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  
jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:    
    - uses: actions/checkout@v5
    - name: Set version
      id: set_version
      run: |
        CF_VERSION=$(grep -m 1 '^version' Cargo.toml | sed 's/version\s*=\s*"\(.*\)"/\1/')                
        printf 'CF_VERSION=%s\n' "$CF_VERSION" >> "$GITHUB_ENV"
        printf 'cf_version=%s\n' "$CF_VERSION" >> "$GITHUB_OUTPUT"
    - name: Show version
      run: echo "$CF_VERSION"
    - name: Log in to registry
      uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: type=raw,value=${{ steps.set_version.outputs.cf_version }}
    - name: Build and push image
      uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
      with:
        context: .
        file: docker/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
