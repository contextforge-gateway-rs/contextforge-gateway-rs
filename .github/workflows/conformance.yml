name: Conformance
run-name: Conformance for PR #${{ github.event.pull_request.number || github.event.issue.number }}

on:
  # Keep the label trigger until this workflow reaches the default branch.
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read

concurrency:
  group: conformance-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  acknowledge:
    name: acknowledge command
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/conformance' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge the command
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh api --method POST "repos/$REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes

  conformance:
    name: conformance
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'run-conformance') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.body == '/conformance' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out data plane
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/merge

      - uses: taiki-e/install-action@v2.75.27
        with:
          tool: cargo-binstall

      - name: Find the matching CI build
        id: ci-build
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          head_revision=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          for attempt in $(seq 1 60); do
            run_id=$(gh api \
              "repos/$REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head_revision&per_page=10" \
              --jq '.workflow_runs[0].id // empty')
            if [ -n "$run_id" ]; then
              artifact_count=$(gh api \
                "repos/$REPOSITORY/actions/runs/$run_id/artifacts?name=contextforge-data-plane-conformance" \
                --jq '.total_count')
              if [ "$artifact_count" -gt 0 ]; then
                echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "Waiting for the CI build artifact for $head_revision ($attempt/60)"
            sleep 10
          done
          echo "No conformance binary artifact was produced by CI for $head_revision" >&2
          exit 1

      - name: Download the matching data-plane binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: contextforge-data-plane-conformance
          path: target/conformance
          run-id: ${{ steps.ci-build.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Verify and package the data-plane image
        run: |
          revision=$(git rev-parse HEAD)
          test "$(cat target/conformance/source-revision)" = "$revision"
          chmod +x target/conformance/contextforge-data-plane
          docker buildx build --load \
            --target conformance-prebuilt \
            --build-context prebuilt=target/conformance \
            --tag contextforge-data-plane:conformance \
            --file docker/Dockerfile .

      - name: Install Node.js 22
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22

      - name: Install cf-integration 0.1.0 binary
        run: cargo binstall cf-integration@0.1.0 --no-confirm

      - name: Run strict modern conformance
        env:
          CF_DATAPLANE_IMAGE: contextforge-data-plane:conformance
          CF_DATAPLANE_PULL_POLICY: never
          CF_DATAPLANE_REF: ""
        run: make conformance

      - name: Upload conformance diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: conformance-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .integration/conformance/
            .integration/reports/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  report:
    name: report conformance result
    if: >-
      always() &&
      github.event_name == 'issue_comment' &&
      needs.conformance.result != 'skipped'
    needs: conformance
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Report the result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          RESULT: ${{ needs.conformance.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$RESULT" in
            success) marker="✅" ;;
            failure) marker="❌" ;;
            cancelled) marker="⚪" ;;
            *) marker="⚠️" ;;
          esac
          body="$marker Conformance **$RESULT** — [view workflow run]($RUN_URL)."
          gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body"
