name: Conformance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out data plane
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - uses: taiki-e/install-action@v2.75.27
        with:
          tool: cargo-binstall

      - name: Install Node.js 22
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22

      - name: Install cf-integration 0.1.0 binary
        run: cargo binstall cf-integration@0.1.0 --no-confirm

      - name: Run strict modern conformance
        run: make conformance

      - name: Upload conformance diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: conformance-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .integration/conformance/
            .integration/reports/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
