name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check

  detect-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Check detect-secrets configuration
        id: detect_secrets_config
        shell: bash
        run: |
          hook_pattern='^[[:space:]]*-[[:space:]]+id:[[:space:]]+detect-secrets([[:space:]]|$)'
          hook_configured=false
          if [[ -f .pre-commit-config.yaml ]] && grep -Eq "${hook_pattern}" .pre-commit-config.yaml; then
            hook_configured=true
          fi

          if [[ "${hook_configured}" == true && -f .secrets.baseline ]]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${hook_configured}" == false && ! -e .secrets.baseline ]]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::detect-secrets enforcement will start when its hook and baseline are added"
          else
            echo "::error::the detect-secrets hook and .secrets.baseline must be added together"
            exit 1
          fi
      - name: Install pre-commit
        if: steps.detect_secrets_config.outputs.configured == 'true'
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python3 -m venv "${RUNNER_TEMP}/pre-commit-venv"
          "${RUNNER_TEMP}/pre-commit-venv/bin/python" -m pip install pre-commit==4.6.0
      - name: Run detect-secrets
        if: steps.detect_secrets_config.outputs.configured == 'true'
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/pre-commit-home
        run: |
          "${RUNNER_TEMP}/pre-commit-venv/bin/pre-commit" run detect-secrets \
            --all-files \
            --show-diff-on-failure

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.75.27
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses

  cargo-shear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo install cargo-shear --version 1.12.4 --locked
      - run: cargo shear --check-test-targets --deny-warnings --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - uses: taiki-e/install-action@v2.75.27
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --workspace --all-features

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo build --locked --workspace --all-features

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo bench --locked --workspace --no-run
