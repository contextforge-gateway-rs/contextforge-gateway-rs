name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check

  detect-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Run detect-secrets
        run: scripts/ci/detect-secrets.sh

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.75.27
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses

  cargo-shear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo install cargo-shear --version 1.12.4 --locked
      - run: cargo shear --check-test-targets --deny-warnings --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - uses: taiki-e/install-action@v2.75.27
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --workspace --all-features

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Build the workspace
        run: cargo build --locked --workspace --all-features

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo bench --locked --workspace --no-run

  conformance:
    name: conformance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out data plane
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - uses: taiki-e/install-action@v2.75.27
        with:
          tool: cargo-binstall

      - name: Install Node.js 22
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22

      - name: Install cf-integration 0.1.0 binary
        run: cargo binstall cf-integration@0.1.0 --no-confirm

      - name: Run strict modern conformance
        run: make conformance

      - name: Upload conformance diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: conformance-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .integration/conformance/
            .integration/reports/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
