name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CPEX_PLUGINS_REF: 9420c4918051a30c2a196a171a1d63ef284521d4

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Checkout cpex-plugins spike dependency
        run: |
          git clone --filter=blob:none https://github.com/IBM/cpex-plugins ../cpex-plugins
          git -C ../cpex-plugins checkout "$CPEX_PLUGINS_REF"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Checkout cpex-plugins spike dependency
        run: |
          git clone --filter=blob:none https://github.com/IBM/cpex-plugins ../cpex-plugins
          git -C ../cpex-plugins checkout "$CPEX_PLUGINS_REF"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Checkout cpex-plugins spike dependency
        run: |
          git clone --filter=blob:none https://github.com/IBM/cpex-plugins ../cpex-plugins
          git -C ../cpex-plugins checkout "$CPEX_PLUGINS_REF"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.75.27
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses

  cargo-shear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Checkout cpex-plugins spike dependency
        run: |
          git clone --filter=blob:none https://github.com/IBM/cpex-plugins ../cpex-plugins
          git -C ../cpex-plugins checkout "$CPEX_PLUGINS_REF"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo install cargo-shear --version 1.12.4 --locked
      - run: cargo shear --check-test-targets --deny-warnings --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Checkout cpex-plugins spike dependency
        run: |
          git clone --filter=blob:none https://github.com/IBM/cpex-plugins ../cpex-plugins
          git -C ../cpex-plugins checkout "$CPEX_PLUGINS_REF"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - uses: taiki-e/install-action@v2.75.27
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --workspace

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Checkout cpex-plugins spike dependency
        run: |
          git clone --filter=blob:none https://github.com/IBM/cpex-plugins ../cpex-plugins
          git -C ../cpex-plugins checkout "$CPEX_PLUGINS_REF"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo build --locked --workspace

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Checkout cpex-plugins spike dependency
        run: |
          git clone --filter=blob:none https://github.com/IBM/cpex-plugins ../cpex-plugins
          git -C ../cpex-plugins checkout "$CPEX_PLUGINS_REF"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: cargo bench --locked --workspace --no-run
