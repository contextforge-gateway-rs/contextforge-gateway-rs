name: MCP Conformance

on:
  workflow_call:

permissions:
  contents: read

env:
  MCP_CONFORMANCE_COLOR: always
  MCP_CONFORMANCE_VERSION: 0.2.0-alpha.11
  MCP_CONFORMANCE_SOURCE_SHA: c321dd32035556e6769d3724a8ee97d87c3faaac # pragma: allowlist secret
  MCP_CONFORMANCE_SPEC_VERSION: 2026-07-28
  MCP_CONFORMANCE_SERVER_ID: 3f33286667d34b65a31c3bafd30e4c21
  CF_CONTROLPLANE_IMAGE: ghcr.io/ibm/mcp-context-forge:latest
  CF_DATAPLANE_IMAGE: contextforge-data-plane:conformance

jobs:
  conformance:
    name: MCP 2026-07-28 through nginx and dataplane
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Check out data plane
        uses: actions/checkout@v6.0.2

      - name: Test conformance reporter
        run: tests/conformance/report-baseline-diff-test.sh

      - name: Test client conformance adapter
        run: |
          python3 -m py_compile tests/conformance/write_client_config.py
          tests/conformance/client-under-test-test.sh
          tests/conformance/bless-client-baseline-test.sh

      - name: Download the conformance binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: contextforge-data-plane-conformance
          path: target/conformance

      - name: Make the conformance binary executable
        run: chmod +x target/conformance/contextforge-data-plane

      - name: Package the data plane conformance image
        run: >-
          docker buildx build --load
          --target conformance-prebuilt
          --build-context prebuilt=target/conformance
          --tag "${CF_DATAPLANE_IMAGE}"
          --file docker/Dockerfile .

      - name: Check out the alpha.11 conformance fixture
        uses: actions/checkout@v6.0.2
        with:
          repository: modelcontextprotocol/conformance
          ref: ${{ env.MCP_CONFORMANCE_SOURCE_SHA }}
          path: .conformance-suite
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .conformance-suite/package-lock.json

      - name: Install official conformance dependencies
        working-directory: .conformance-suite
        run: |
          test "$(node -p "require('./package.json').version")" = "${MCP_CONFORMANCE_VERSION}"
          npm ci --ignore-scripts

      # The pinned conformance CLI has no scenario-exclusion option. Apply an
      # exact patch so this flaky scenario is not run until forwarding is ordered.
      - name: Temporarily disable the flaky progress scenario
        working-directory: .conformance-suite
        run: git apply ../tests/conformance/disable-flaky-progress.patch

      - name: Pull external stack images
        env:
          MCP_CONFORMANCE_TOKEN: pull-only
        run: >-
          docker compose -f tests/conformance/docker-compose.yml
          pull redis fixture-proxy control-plane nginx

      - name: Start the fixture and control plane
        env:
          MCP_CONFORMANCE_TOKEN: bootstrap-only
        run: tests/conformance/start-fixture-and-control-plane.sh

      - name: Register the official fixture through the control plane
        env:
          MCP_CONFORMANCE_TOKEN: bootstrap-only
        run: tests/conformance/register-fixture.sh

      - name: Start dataplane and nginx
        run: tests/conformance/start-dataplane-and-nginx.sh

      - name: Run MCP 2026-07-28 requirements
        id: runner
        run: tests/conformance/run-conformance.sh

      - name: Run scoped MCP 2026-07-28 client conformance
        run: tests/conformance/run-client-conformance.sh

      - name: Report conformance baseline diff
        if: always()
        run: tests/conformance/report-baseline-diff.sh conformance-results/server

      - name: Print live stack logs
        if: always()
        env:
          MCP_CONFORMANCE_TOKEN: diagnostics-only
        run: >-
          docker compose -f tests/conformance/docker-compose.yml
          logs --no-color || true

      - name: Print official fixture log
        if: always()
        run: |
          if [ -f conformance-logs/reference-server.log ]; then
            sed -n '1,240p' conformance-logs/reference-server.log
          else
            echo "No official fixture log was produced."
          fi

      - name: Stop the live stack
        if: always()
        env:
          MCP_CONFORMANCE_TOKEN: cleanup-only
        run: tests/conformance/stop-live-stack.sh
