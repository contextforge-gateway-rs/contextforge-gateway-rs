[workspace]
members = [
    "crates/contextforge-gateway-rs",
    "crates/contextforge-gateway-rs-apis",
    "crates/contextforge-gateway-rs-cpex",
    "crates/contextforge-gateway-rs-lib",
    "crates/contextforge-load-test",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
keywords = ["mcp", "gateway", "rust", "contextforge", "a2a", "ai", "llm"]
homepage = "https://github.com/contextforge-gateway-rs/contextforge-gateway-rs"
readme = "./README.md"
repository = "https://github.com/contextforge-gateway-rs/contextforge-gateway-rs"


[workspace.dependencies]
# Keep dependencies here only when at least two workspace members inherit them.
contextforge-gateway-rs-cpex = { path = "./crates/contextforge-gateway-rs-cpex" }
contextforge-gateway-rs-apis = { path = "./crates/contextforge-gateway-rs-apis"}
rmcp = { version = "3.0.0-beta.3", features = [
    "server",
    "client",
    "auth",
    "transport-streamable-http-server",
    "reqwest",
    "transport-streamable-http-client-reqwest",
    "elicitation",
] }
serde = {version= "1.0"}
serde_json = "1.0"
tracing = "0.1"
tracing-opentelemetry = "0.33.0"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "metrics"] }
tokio = { version = "1.48.0", features = ["full"] }
http = "1.4.0"
redis = { version = "1.2.1", features = [
    "default",
    "tokio-rustls-comp",
    "tls-rustls",
    "connection-manager"
] }
clap = { version = "4.5.60", features = ["derive", "env"] }
thiserror = "2.0.18"
rmp-serde = "1.3.1"
async-trait = "0.1.89"
reqwest = "0.13"
rustls = { version = "0.23", features = ["ring"] }
cpex = "=0.2.2"
uuid = { version = "1.23.1", features = ["v4"] }

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = "abort"
rpath = false
strip = "debuginfo"


[profile.release-debuginfo]
debug = "full"
inherits = "release"
panic = "abort"
split-debuginfo = "packed"
strip = false

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
#struct_field_names = "allow"
cast_sign_loss = "allow"
clone_on_ref_ptr = "warn"
disallowed-methods = "deny"
doc_markdown = "allow"
get_unwrap = "warn"
if_then_some_else_none = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
str_to_string = "warn"
implicit_clone = "warn"
todo = "warn"
unwrap_used = "warn"
